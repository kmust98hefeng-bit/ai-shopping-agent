<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>买家短名单</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <p><a href="/">返回</a></p>
    <h1>买家短名单</h1>
    <p id="error" class="error"></p>
    <section>
      <h2>约束</h2>
      <label>最低持续输出功率（W） <input id="min-power" type="number" min="0" value="65"></label>
      <label><input id="require-pd" type="checkbox" checked> 必须支持 PD 3.1</label>
      <label>最高价格（元，可空） <input id="max-price" type="number" min="0" step="0.01"></label>
      <label><input id="require-returnable" type="checkbox"> 必须可退</label>
      <button id="search" type="button">生成短名单</button>
    </section>
    <section>
      <h2>短名单</h2>
      <div id="shortlist" class="muted">还没有结果。</div>
    </section>
    <section>
      <h2>询问卖家</h2>
      <label>商品
        <select id="ask-product"></select>
      </label>
      <button id="ask-button" type="button">询问 PD 3.1 兼容</button>
      <div id="ask-result"></div>
    </section>
    <section>
      <h2>对比</h2>
      <label>商品甲 <select id="compare-a"></select></label>
      <label>商品乙 <select id="compare-b"></select></label>
      <button id="compare" type="button">对比</button>
      <div id="compare-result"></div>
    </section>
  </main>
  <script type="module" src="/buyer.js"></script>
</body>
</html>
