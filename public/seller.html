<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>卖家录入</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <p><a href="/">返回</a></p>
    <h1>卖家录入</h1>
    <p id="error" class="error"></p>
    <p id="sort-rule" class="rule"></p>
    <section>
      <h2>卖家</h2>
      <label>当前卖家
        <select id="seller"></select>
      </label>
    </section>
    <section>
      <h2>商品</h2>
      <div id="product-list"></div>
    </section>
    <section>
      <h2>新建商品</h2>
      <form id="create-form">
        <label>标题 <input id="title" required></label>
        <label>价格（元） <input id="price" type="number" min="0" step="0.01" value="99" required></label>
        <label>库存 <input id="stock" type="number" min="0" step="1" value="10" required></label>
        <label><input id="returnable" type="checkbox" checked> 可退</label>
        <label>营销说明（不计入完整度） <input id="description" placeholder="手感极佳"></label>
        <button type="submit">创建</button>
      </form>
    </section>
    <section>
      <h2 id="detail-title">商品详情</h2>
      <div id="detail" class="muted">选择一个商品。</div>
    </section>
    <section>
      <h2>问题箱 <span id="inbox-count"></span></h2>
      <div id="inbox"></div>
    </section>
    <section>
      <h2>归因</h2>
      <div id="attributions"></div>
    </section>
    <section>
      <h2>类目模板</h2>
      <div id="template"></div>
      <form id="attribute-form">
        <label>属性标识 <input id="attr-id" placeholder="color" required></label>
        <label>名称 <input id="attr-name" required></label>
        <label><input id="attr-required" type="checkbox"> 必填</label>
        <button type="submit">增加属性</button>
      </form>
    </section>
  </main>
  <script type="module" src="/seller.js"></script>
</body>
</html>
